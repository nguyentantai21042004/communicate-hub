[package]
name = "captain-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "captain"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
captain-core.workspace = true
captain-format.workspace = true
captain-inbox.workspace = true
captain-ipc.workspace = true
captain-protocol.workspace = true
captain-store.workspace = true
captain-vault.workspace = true
clap.workspace = true
hub-analytics.workspace = true
hub-bridge.workspace = true
hub-core.workspace = true
hub-store.workspace = true
hub-tgbot.workspace = true
hub-web.workspace = true
hub-zalo.workspace = true
# Decodes the Zalo QR PNG into terminal half-blocks.
png = "0.17"
regex.workspace = true
rusqlite.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
