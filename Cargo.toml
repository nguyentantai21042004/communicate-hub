[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
captain-core = { path = "crates/captain-core" }
captain-format = { path = "crates/captain-format" }
captain-inbox = { path = "crates/captain-inbox" }
captain-ipc = { path = "crates/captain-ipc" }
captain-protocol = { path = "crates/captain-protocol" }
captain-store = { path = "crates/captain-store" }
captain-vault = { path = "crates/captain-vault" }
hub-analytics = { path = "crates/hub-analytics" }
hub-bridge = { path = "crates/hub-bridge" }
hub-core = { path = "crates/hub-core" }
hub-store = { path = "crates/hub-store" }
hub-tgbot = { path = "crates/hub-tgbot" }
hub-web = { path = "crates/hub-web" }
hub-zalo = { path = "crates/hub-zalo" }

# Pinned to one minor: grammers is pre-1.0 and breaks between 0.x releases.
grammers-client = { version = "=0.10.0", default-features = false, features = ["fs"] }
grammers-mtsender = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = { version = "=0.10.0", features = ["impl-serde"] }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
keyring = { version = "3", features = ["apple-native"] }
mime_guess = "2"
regex = "1"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Correctness and hygiene: library code never panics on its own input.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Doc hygiene enforced by docs/CONVENTIONS.md.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
# Readability.
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

# PERF: full debuginfo made target/ grow by about 1 GB per few builds. On macOS, rustc keeps one
# object file per codegen unit next to each debug artifact, and never deletes stale ones.
# Dependencies get no debuginfo; workspace crates keep line tables so backtraces still show
# file:line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
